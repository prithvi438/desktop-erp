<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:">
  <title>Speedo One Books</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <aside id="side">
    <div id="sidebar-company" aria-label="Active company"></div>
    <nav id="nav"></nav>
  </aside>
  <div id="work">
    <header>
      <h1 id="title"></h1>
      <span id="sync"></span>
      <span id="company"></span>
      <span id="today"></span>
      <button id="theme-toggle" type="button" title="Ctrl+Shift+L">Dark mode</button>
    </header>
    <main id="main"></main>
    <footer id="hints"></footer>
  </div>
  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
