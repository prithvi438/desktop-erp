appId: com.desktoperp.books
productName: Desktop ERP
directories:
  output: dist
  buildResources: build
electronDist: node_modules/electron/dist
npmRebuild: false
# PostgreSQL executables and its worker must have physical filesystem paths.
asar: false
files:
  - main.js
  - preload.js
  - src/**/*
  - renderer/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Desktop ERP
  deleteAppDataOnUninstall: false
  runAfterFinish: false
artifactName: Desktop-ERP-${version}-Setup-${arch}.${ext}
